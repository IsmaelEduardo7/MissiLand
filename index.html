<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUCE TEC - MissiLand</title>

    <!-- Tailwind CSS desde CDN (Resuelve que todo se vea gigante o roto) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Geist Pixel (Tu elección) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

    <!-- Estilo personalizado para aplicar la fuente e iconos -->
    <style>
        body {
            font-family: 'Geist Pixel', monospace, sans-serif;
        }
    </style>
</head>

<body class="bg-[#f3effa] min-h-screen text-gray-800">

    <!-- BARRA DE NAVEGACIÓN (Igual al proyector) -->
    <nav class="bg-white px-8 py-4 flex items-center justify-between shadow-sm">
        <!-- Logo con texto e icono de espada opcional -->
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-purple-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13H5.5L12 6.5z"/>
            </svg>
            <span class="font-bold text-gray-700 tracking-wide text-lg">PUCE TEC</span>
        </div>

        <!-- Enlaces de Navegación -->
        <div class="flex items-center gap-8 text-sm font-medium text-gray-600">
            <a href="#" class="hover:text-purple-600 transition-colors">Home</a>
            <a href="#" class="hover:text-purple-600 transition-colors">Nosotros</a>
            <a href="#" class="hover:text-purple-600 transition-colors">Catálogo</a>
            <a href="#" class="hover:text-purple-600 transition-colors">Contáctanos</a>
            <a href="#" class="bg-purple-300 hover:bg-purple-400 text-purple-900 px-4 py-1.5 rounded-full text-xs font-semibold transition-all">Login</a>
        </div>
    </nav>

    <!-- SECCIÓN HERO (Banner Principal) -->
    <main class="container mx-auto px-6 py-16 flex flex-col lg:flex-row items-center justify-between gap-12">
        
        <!-- Texto Izquierdo -->
        <div class="lg:w-1/2 space-y-6">
            <h1 class="text-4xl lg:text-5xl font-extrabold text-gray-900 leading-tight">
                Best place to choose <br>
                your <span class="text-purple-700">games</span>
            </h1>
            
            <p class="text-gray-500 text-sm max-w-md leading-relaxed">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Porro beatae error laboriosam ab amet sunt recusandae? Reiciendis natus perspiciatis optio.
            </p>

            <button class="bg-[#4c35de] hover:bg-[#3b27be] text-white text-xs font-bold px-6 py-3 rounded-md uppercase tracking-wider shadow-md transition-all">
                Shop Now
            </button>
        </div>

        <!-- Imagen Derecha -->
        <div class="lg:w-1/2 flex justify-center">
            <div class="w-full max-w-lg overflow-hidden rounded-lg shadow-xl border-4 border-white">
                <img class="w-full h-[320px] object-cover" 
                     src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80" 
                     alt="Videojuegos MissiLand">
            </div>
        </div>

    </main>

</body>

</html>
