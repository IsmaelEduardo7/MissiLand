<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUCE TEC - Catálogo</title>
    <link rel="icon" type="image/png" href="/imgs/espada.png?v=1">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fuente personalizada Geist Pixel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Geist Pixel', monospace, sans-serif;
        }
    </style>
</head>

<body class="bg-[#f3effa] min-h-screen text-gray-800">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="bg-white px-8 py-4 flex items-center justify-between shadow-sm">
        <!-- Logo con imagen de espada y nombre del sitio -->
        <div class="flex items-center gap-2">
            <img src="/imgs/espada.png" alt="Logo MissiLand" class="w-7 h-7 object-contain">
            <span class="font-bold text-gray-700 tracking-wide text-lg">MissiLand</span>
        </div>

        <div class="flex items-center gap-8 text-sm font-medium text-gray-600">
            <a href="/index.html" class="hover:text-purple-600 transition-colors">Home</a>
            <a href="#" class="hover:text-purple-600 transition-colors">Nosotros</a>
            <a href="#" class="hover:text-purple-600 transition-colors">Catálogo</a>
            <a href="#" class="hover:text-purple-600 transition-colors">Contáctanos</a>
            <a href="#" class="bg-purple-300 hover:bg-purple-400 text-purple-900 px-4 py-1.5 rounded-full text-xs font-semibold transition-all">Login</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mx-auto px-6 py-12">
        
        <!-- Encabezado de la página -->
        <div class="mb-10 text-center md:text-left">
            <h1 class="text-4xl font-extrabold text-gray-900">Catálogo de <span class="text-purple-700">Juegos</span></h1>
            <p class="text-gray-600 mt-2 max-w-xl">
                Explora los últimos lanzamientos y mejores títulos disponibles en MissiLand.
            </p>
        </div>

        <!-- REJILLA DONDE MAIN.JS INYECTARÁ LOS 4 COMPONENTES -->
        <div id="grid-juegos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 justify-items-center">
            <!-- Las tarjetas de juegos se renderizan dinámicamente aquí -->
        </div>

    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
